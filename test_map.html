<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { padding: 0; margin: 0; background-color: #0A0A0A; }
    html, body, #map { height: 100%; width: 100%; }
    .leaflet-layer,
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out,
    .leaflet-control-attribution {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }
    .leaflet-container { background: #0A0A0A; }
    
    .custom-marker {
      background-color: #00FFFF;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      border: 3px solid #0A0A0A;
      box-shadow: 0 0 10px rgba(0,255,255,0.8);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', {
      zoomControl: false
    }).setView([18.5204, 73.8567], 12);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    var locations = [{"id": 4, "title": "FC Road Digital Billboard", "type": "Digital Banner", "lat": 18.5195, "lng": 73.8375, "price": 500, "status": "Available", "photos": ["https://images.unsplash.com/photo-1534430480872-3498386e7856?auto=format&fit=crop&w=400&q=80"], "footfall": "50K+", "screens": 2, "size": "1920x1080"}];
    
    locations.forEach(function(loc) {
      var icon = L.divIcon({
        className: 'custom-marker',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
      
      var marker = L.marker([loc.lat, loc.lng], {icon: icon}).addTo(map);
      marker.on('click', function() {
        window.ReactNativeWebView.postMessage(JSON.stringify(loc));
      });
    });
  </script>
</body>
</html>
